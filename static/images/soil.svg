<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Soft organic background -->
  <rect width="100" height="100" rx="20" fill="#f5ebe0"/>
  
  <!-- Soil Mound / Earth (माटो) -->
  <!-- Layer 1: Dark fertile base soil -->
  <path d="M 12,82 C 22,68 40,65 50,65 C 60,65 78,68 88,82 C 90,85 86,88 80,88 L 20,88 C 14,88 10,85 12,82 Z" fill="#4a2e18"/>
  
  <!-- Layer 2: Mid-tone organic rich soil -->
  <path d="M 18,80 C 26,70 38,68 50,68 C 62,68 74,70 82,80 C 80,84 20,84 18,80 Z" fill="#6d4c33"/>

  <!-- Soil particles / texture dots -->
  <circle cx="28" cy="76" r="2.5" fill="#8d6749"/>
  <circle cx="42" cy="74" r="2" fill="#8d6749"/>
  <circle cx="58" cy="75" r="2.5" fill="#8d6749"/>
  <circle cx="72" cy="77" r="2" fill="#8d6749"/>
  <circle cx="35" cy="81" r="2" fill="#361f0d"/>
  <circle cx="50" cy="80" r="2" fill="#361f0d"/>
  <circle cx="65" cy="81" r="2" fill="#361f0d"/>

  <!-- Growing Green Plant / Seedling emerging from Soil -->
  <!-- Stem -->
  <path d="M 50,70 Q 49,46 50,32" fill="none" stroke="#2e7d32" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Left Sprout Leaf -->
  <path d="M 50,50 C 35,46 30,32 30,30 C 34,42 46,47 50,50 Z" fill="#43a047"/>
  <path d="M 50,50 C 38,47 34,36 30,30" fill="none" stroke="#2e7d32" stroke-width="1.2"/>

  <!-- Right Sprout Leaf -->
  <path d="M 50,42 C 65,38 70,24 70,22 C 66,34 54,39 50,42 Z" fill="#66bb6a"/>
  <path d="M 50,42 C 62,39 66,28 70,22" fill="none" stroke="#2e7d32" stroke-width="1.2"/>

  <!-- Top Fresh Bud -->
  <ellipse cx="50" cy="30" rx="3.5" ry="6" fill="#81c784" transform="rotate(10 50 30)"/>
</svg>
