<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Border (Blue) -->
  <polygon points="0,0 85,55 35,55 95,115 0,115" fill="#003893" filter="url(#shadow)" stroke="#003893" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner Crimson Red Field -->
  <polygon points="4,7 77,54 29,54 85,110 4,110" fill="#DC143C"/>
  <!-- Moon (Upper Pennant) -->
  <g fill="#FFFFFF" transform="translate(24, 38) scale(0.75)">
    <path d="M 0,-14 A 14,14 0 1,0 0,14 A 12,12 0 1,1 0,-14 Z"/>
    <polygon points="0,-10 3,-4 9,-5 5,0 8,5 2,3 -1,8 -2,2 -8,3 -4,-2 -7,-7 -1,-5"/>
  </g>
  <!-- Sun (Lower Pennant) - 12 Rays -->
  <g fill="#FFFFFF" transform="translate(26, 85) scale(0.9)">
    <circle cx="0" cy="0" r="7"/>
    <!-- 12 rays -->
    <polygon points="0,-16 2,-10 -2,-10"/>
    <polygon points="8,-14 6,-8 3,-10"/>
    <polygon points="14,-8 10,-3 8,-6"/>
    <polygon points="16,0 10,2 10,-2"/>
    <polygon points="14,8 8,6 10,3"/>
    <polygon points="8,14 3,10 6,8"/>
    <polygon points="0,16 -2,10 2,10"/>
    <polygon points="-8,14 -6,8 -3,10"/>
    <polygon points="-14,8 -10,3 -8,6"/>
    <polygon points="-16,0 -10,-2 -10,2"/>
    <polygon points="-14,-8 -8,-6 -10,-3"/>
    <polygon points="-8,-14 -3,-10 -6,-8"/>
  </g>
</svg>
