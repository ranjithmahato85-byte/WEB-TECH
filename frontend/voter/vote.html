<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Ballot - Nepal Online Voting System</title>
  <link rel="stylesheet" href="../../static/css/style.css">
  <link rel="stylesheet" href="../../static/css/dashboard.css">
  <link rel="stylesheet" href="../../static/css/supabase-auth.css">
  <link rel="stylesheet" href="../../static/css/supabase-public.css">
  <link rel="icon" type="image/svg+xml" href="../../static/images/nepal-flag.svg">
</head>
<body data-required-role="voter">
  <div class="dashboard-wrapper">
    <aside class="sidebar"><div class="sidebar-user"><div class="sidebar-avatar"><img src="../../static/images/candidates/voter-avatar.svg" alt="Voter avatar"></div><div class="sidebar-user-info"><span class="sidebar-user-name">Voter portal</span><div class="sidebar-user-role"><span>Secure ballot</span></div></div></div><nav class="sidebar-nav" aria-label="Voter navigation"><a href="./dashboard.html" class="sidebar-link"><span>Dashboard</span></a><a href="./elections.html" class="sidebar-link active"><span>My Elections</span></a><a href="./status.html" class="sidebar-link"><span>Voting Status</span></a><a href="../index.html" class="sidebar-link"><span>Public Site</span></a></nav><div class="sidebar-footer"><img src="../../static/images/nepal-flag.svg" alt="Nepal flag" class="sidebar-flag"><span class="sidebar-motto">Your vote is secret and secure</span></div></aside>
    <div class="main-content">
      <header class="top-bar"><div class="page-headline"><h1 class="page-title">Review Ballot</h1><span class="page-subtext">Select one approved candidate</span></div><a href="./elections.html" class="btn btn-outline btn-sm">Back to elections</a></header>
      <main class="content-body"><section class="dashboard-card"><h2 data-election-title>Loading election...</h2><p class="auth-help">Your voter identity is checked separately from the anonymous ballot record.</p><div class="auth-message" data-vote-message role="alert" aria-live="polite"></div><div data-ballot>Loading approved candidates...</div><button class="btn btn-primary" type="button" data-cast-vote>Confirm and cast vote</button></section></main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../static/js/supabase-config.js"></script><script src="../../static/js/supabase-client.js"></script><script src="../../static/js/supabase-auth.js"></script><script src="../../static/js/voter-voting.js"></script>
</body>
</html>
