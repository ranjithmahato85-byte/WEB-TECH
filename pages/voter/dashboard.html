<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voter portal | Nepal Online Voting</title>
  <link rel="stylesheet" href="../../static/css/supabase-auth.css">
</head>
<body class="auth-body" data-required-role="voter">
  <main class="portal-shell">
    <header class="portal-header">
      <div>
        <p class="auth-help">Nepal Online Voting</p>
        <h1>Voter portal</h1>
      </div>
      <button class="portal-action" type="button" data-sign-out>Sign out</button>
    </header>
    <section class="portal-panel" aria-labelledby="welcome-title">
      <h2 id="welcome-title">Welcome, <span data-profile-name>voter</span></h2>
      <div class="portal-status" data-profile-status role="status" aria-live="polite">Loading account status...</div>
      <p><a class="portal-action" href="elections.html">View active elections</a></p>
      <p><a class="portal-action" href="status.html">View voting status</a></p>
      <h3>Citizenship document</h3>
      <p class="auth-help">Upload one clear JPG, PNG, or PDF copy. Maximum file size: 5 MB.</p>
      <form class="auth-form" data-document-form>
        <div class="auth-message" data-document-message role="alert" aria-live="polite"></div>
        <div class="auth-field">
          <label for="document">Citizenship document</label>
          <input id="document" name="document" type="file" accept=".jpg,.jpeg,.png,.pdf" required>
        </div>
        <button class="portal-action" type="submit">Submit document</button>
      </form>
      <p class="auth-help">Election pages and voting status are connected to Supabase.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../static/js/supabase-config.js"></script>
  <script src="../../static/js/supabase-client.js"></script>
  <script src="../../static/js/supabase-auth.js"></script>
  <script src="../../static/js/portal-page.js"></script>
  <script src="../../static/js/voter-document.js"></script>
</body>
</html>
