<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing out | Nepal Online Voting</title>
  <link rel="stylesheet" href="../../static/css/supabase-auth.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-panel">
      <div class="auth-form-wrap">
        <h1>Signing out</h1>
        <p class="auth-help" data-logout-message>Ending your Supabase session...</p>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../static/js/supabase-config.js"></script>
  <script src="../../static/js/supabase-client.js"></script>
  <script src="../../static/js/supabase-auth.js"></script>
  <script>
    (async function () {
      const message = document.querySelector('[data-logout-message]');
      try {
        await window.VotingAuth.signOut();
        window.location.replace('login.html');
      } catch (error) {
        message.textContent = error.message || 'Sign out failed. Please close this page and try again.';
      }
    }());
  </script>
</body>
</html>
