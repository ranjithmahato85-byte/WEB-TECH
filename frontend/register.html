<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voter Registration - Nepal Online Voting System</title>
  <link rel="stylesheet" href="../static/css/style.css"><link rel="stylesheet" href="../static/css/dashboard.css"><link rel="stylesheet" href="../static/css/supabase-auth.css"><link rel="icon" type="image/svg+xml" href="../static/images/nepal-flag.svg">
</head>
<body>
  <div class="auth-page-wrapper" style="padding: 2.5rem 1rem;"><div style="width: 100%; max-width: 880px; background: #ffffff; border-radius: var(--radius-xl); border: 1px solid var(--border-color); box-shadow: var(--shadow-lg); overflow: hidden;">
    <div style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #ffffff; padding: 2rem 2.5rem;"><div style="display: flex; align-items: center; justify-content: space-between;"><div><span class="badge-pill-soft" style="background: rgba(255,255,255,0.1); color: #93c5fd;">Election Commission of Nepal</span><h1 style="font-size: 1.75rem; font-weight: 800; margin-top: 6px;">Voter Registration</h1><p style="color: #cbd5e1; font-size: 0.9rem;">Create your verified citizen account to participate in democratic online elections.</p></div><img src="../static/images/nepal-flag.svg" alt="Flag" style="width: 40px; height: 50px;"></div></div>
    <div style="padding: 2.5rem;"><div id="auth-message" class="alert" hidden role="status"></div><form id="register-form">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;" class="form-row">
        <div><h3 style="font-size: 1rem; font-weight: 700; color: #0f172a; margin-bottom: 1rem; border-bottom: 2px solid var(--primary-blue-light); padding-bottom: 6px;">1. Personal &amp; Contact Details</h3>
          <div class="form-group"><label class="form-label" for="full_name">Full Name <span class="required">*</span></label><input type="text" id="full_name" class="form-control" required></div>
          <div class="form-group"><label class="form-label" for="date_of_birth">Date of Birth <span class="required">*</span></label><input type="date" id="date_of_birth" class="form-control" required></div>
          <div class="form-group"><label class="form-label" for="email">Email Address <span class="required">*</span></label><input type="email" id="email" class="form-control" required></div>
          <div class="form-group"><label class="form-label" for="mobile">Mobile Number <span class="required">*</span></label><input type="tel" id="mobile" class="form-control" pattern="[0-9]{10}" required></div>
        </div>
        <div><h3 style="font-size: 1rem; font-weight: 700; color: #0f172a; margin-bottom: 1rem; border-bottom: 2px solid var(--primary-blue-light); padding-bottom: 6px;">2. Electoral Constituency &amp; Location</h3>
          <div class="form-group"><label class="form-label" for="province">Province <span class="required">*</span></label><select id="province" class="form-control" required><option value="">Select Province</option><option>Koshi</option><option>Madhesh</option><option selected>Bagmati</option><option>Gandaki</option><option>Lumbini</option><option>Karnali</option><option>Sudurpashchim</option></select></div>
          <div style="display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 10px;"><div class="form-group"><label class="form-label" for="district">District <span class="required">*</span></label><input type="text" id="district" class="form-control" required></div><div class="form-group"><label class="form-label" for="ward">Ward No. <span class="required">*</span></label><input type="number" id="ward" class="form-control" min="1" max="35" required></div></div>
          <div class="form-group"><label class="form-label" for="municipality">Municipality / Rural Municipality <span class="required">*</span></label><input type="text" id="municipality" class="form-control" required></div>
          <div class="form-group"><label class="form-label" for="citizenship_number">Citizenship Identity <span class="required">*</span></label><input type="text" id="citizenship_number" class="form-control" placeholder="e.g. 27-01-76-08891" required></div>
        </div>
      </div>
      <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);"><h3 style="font-size: 1rem; font-weight: 700; color: #0f172a; margin-bottom: 1rem;">3. Account Login Credentials</h3><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;" class="form-row"><div class="form-group"><label class="form-label" for="password">Password <span class="required">*</span></label><input type="password" id="password" class="form-control" minlength="8" required></div><div class="form-group"><label class="form-label" for="confirm_password">Confirm Password <span class="required">*</span></label><input type="password" id="confirm_password" class="form-control" minlength="8" required></div></div><div style="margin: 1.25rem 0;"><label class="form-check"><input type="checkbox" id="terms" required><span>I confirm that the details provided are true and I agree to the electoral terms.</span></label></div><div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;"><div style="font-size: 0.9rem; color: var(--text-muted);">Already registered? <a href="./login.html" style="font-weight: 600;">Go to Login</a></div><button type="submit" class="btn btn-primary btn-lg" style="min-width: 200px;">Register Voter</button></div></div>
    </form></div>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../static/js/supabase-config.js"></script><script src="../static/js/supabase-client.js"></script><script src="../static/js/supabase-auth.js"></script><script src="../static/js/static-auth-ui.js"></script>
</body>
</html>
